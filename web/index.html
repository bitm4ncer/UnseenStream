<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Unseen Stream</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/favicon-192.png">
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#08080a">
  <link rel="stylesheet" href="styles.css">
</head>
<body class="controls-visible">

  <main id="video-container">
    <div id="loading">Suchen…</div>
    <div id="player" style="visibility: hidden;"></div>
    <video id="native-player" playsinline preload="metadata"></video>

    <div id="overlay">
      <div class="action-rail">
        <button id="heart-btn" onclick="toggleSave()" title="Save video" aria-label="Save video">♡</button>
        <button id="download-btn" onclick="downloadCurrent()" title="Download video" aria-label="Download video">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 3v12"></path>
            <path d="M7 10l5 5 5-5"></path>
            <path d="M4 19h16"></path>
          </svg>
        </button>
        <button id="library-btn" onclick="openSaved()" title="Saved videos" aria-label="Saved videos">
          <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
            <path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20"></path>
            <path d="M6.5 2H20v20H6.5A2.5 2.5 0 0 1 4 19.5v-15A2.5 2.5 0 0 1 6.5 2z"></path>
          </svg>
        </button>
      </div>
    </div>

    <div id="controls">
      <div id="timeline" role="slider" aria-label="Progress" tabindex="0" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
        <div id="timeline-track"></div>
        <div id="timeline-fill"></div>
        <div id="timeline-head"></div>
      </div>

      <div class="footer-info">
        <img id="brand-mark" src="/favicon.svg" alt="" width="22" height="22">
        <div id="video-info-text">
          <h1 id="video-title">Loading…</h1>
          <div class="meta-row">
            <span id="video-source" class="source-badge">YouTube</span>
            <p id="video-stats"></p>
          </div>
        </div>
      </div>

      <div class="footer-controls">
        <div class="controls-side controls-left">
          <div id="source-toggle" role="group" aria-label="Sources">
            <button type="button" class="source-btn active" data-source="youtube" data-tooltip="YouTube" aria-label="YouTube" aria-pressed="true">
              <img src="/icons/youtube.svg" alt="" width="18" height="13">
            </button>
            <button type="button" class="source-btn active" data-source="archive" data-tooltip="archive.org" aria-label="archive.org" aria-pressed="true">
              <img src="/icons/archive.svg" alt="" width="16" height="16">
            </button>
          </div>
        </div>

        <div class="nav-buttons">
          <button id="prev-btn" class="icon-btn" onclick="previousVideo()" title="Previous (←)" aria-label="Previous video">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M15 18l-6-6 6-6"/>
            </svg>
          </button>
          <button id="play-pause-btn" class="play-btn" onclick="togglePlayPause()" title="Play / Pause (Space)" aria-label="Play or pause">
            <svg class="play-icon" viewBox="0 0 24 24" fill="currentColor"><path d="M8 5v14l11-7z"/></svg>
            <svg class="pause-icon" viewBox="0 0 24 24" fill="currentColor"><rect x="6" y="5" width="4" height="14" rx="1"/><rect x="14" y="5" width="4" height="14" rx="1"/></svg>
          </button>
          <button id="next-btn" class="icon-btn" onclick="nextVideo()" title="Next (→)" aria-label="Next video">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M9 6l6 6-6 6"/>
            </svg>
          </button>
        </div>

        <div class="controls-side controls-right">
          <span id="unseen-count" class="unseen-count">—</span>
          <button id="autoplay-btn" onclick="toggleAutoplay()" title="Autoplay next video">Autoplay</button>
        </div>
      </div>
    </div>

    <button id="fade-btn" onclick="toggleControls()" title="Hide controls" aria-label="Hide controls">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M6 9l6 6 6-6"/>
      </svg>
    </button>
  </main>

  <div id="welcome-modal" class="modal">
    <div class="modal-content">
      <img class="modal-mark" src="/favicon.svg" alt="Unseen Stream" width="64" height="64">
      <h2>Every video here has no views.</h2>
      <p class="lede">Be the first person on the internet to watch them.</p>
      <p class="body">Swipe up for the next one. Once you have seen a video, it is gone for everyone else.</p>
      <button class="primary-btn" onclick="closeWelcome()">Start watching</button>
    </div>
  </div>

  <div id="saved-modal" class="modal">
    <div class="modal-content">
      <div class="modal-head">
        <h2>Saved <span id="saved-count">0</span></h2>
        <button class="close-btn" onclick="closeSaved()" aria-label="Close">×</button>
      </div>
      <div id="saved-list" class="video-list"></div>
    </div>
  </div>

  <script src="https://www.youtube.com/iframe_api"></script>
  <script src="script.js"></script>
</body>
</html>
